<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Walking Service - Dog of the Day</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<style> body {
      background-color: #000;
      color: #333;
      font-size: 10px;
      font-family: 'Comic Sans MS', cursive;
      overflow: hidden;
    }
    .container {
      text-align: center;
      margin-top: 20px;
    }
    .dog-image {
      width: 150px;
      height: 150px;
      animation: spin 0.7s infinite linear;
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
    .dog-info {
      animation: blink 0.5s infinite;
      line-height: 1;
    }
    @keyframes blink {
      50% { opacity: 0; }
    }
    .buttons {
      margin-top: 10px;
    }
    .action-button {
      width: 1px;
      height: 1px;
      font-size: 2px;
      margin: 2px;
      padding: 2px;
      background-color: pink;
      color: lightgoldenrodyellow;
      border: 1px solid lightgrey;
      cursor: pointer;
    }
    .action-button:hover {
      background-color: #777;
    }
    .info-text {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 100px;
      animation: slide 0.03s infinite;
    }
    @keyframes slide {
      0% { transform: translateX(0); }
      50% { transform: translateX(200px); }
      100% { transform: translateX(0); }
    }</style>
</head>
<body>
  <div id="app">
    <div class="container">
      <div class="info-text">
        Welcome to our dog walking service, PLEASE BOOK IT UNTIL EOS - EMAIL US AS Khanggavaichuong@gmail.com with @ChickenK
      </div>
      <h1>Dog of the Day</h1>
      <img class="dog-image" :src="dogImage" alt="DI"/>
      <div class="dog-info">
        <p>Name: Sparky</p>
        <p>Breed: Golden Retriever</p>
        <p>Age: 3 years</p>
        <p>Favorite Activity: Chasing squirrels!</p>
      </div>
      <div class="buttons">
        <button type="button" class="action-button">Book Walk</button>
        <button type="button" class="action-button">Call Us</button>
        <button type="button" class="action-button">Email</button>
        <button type="button" class="action-button">More Info</button>
      </div>
    </div>
  </div>
  <script>
    const { createApp } = Vue;

    createApp({
      data() {
        return {
          dogImage: ''
        };
      },
      mounted() {
        fetch('https://dog.ceo/api/breeds/image/random')
          .then(response => response.json())
          .then(data => {
            this.dogImage = data.message;
          })
          .catch(error => {
            console.error('Error fetching dog image:', error);
            this.dogImage = 'https://via.placeholder.com/150';
          });
      }
    }).mount('#app');
  </script>
</body>
</html>
