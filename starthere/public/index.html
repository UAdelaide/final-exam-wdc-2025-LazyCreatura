<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Walking Service - Dog of the Day</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="/stylesheets/style.css">
</head>
<body>
  <div id="app">
    <div class="container">
      <div class="info-text">
        Welcome to our dog walking service! Book now! Limited slots! Call us! Email us! Visit us! Check our rates! So many dogs! Hurry up! Offer ends soon!
      </div>
      <h1>Dog of the Day</h1>
      <img class="dog-image" src="dogImage" alt="DI"/>
      <div class="dog-info">
        <p>Name: Sparky</p>
        <p>Breed: Golden Retriever</p>
        <p>Age: 3 years</p>
        <p>Favorite Activity: Chasing squirrels!</p>
      </div>
      <div class="buttons">
        <button type="button" class="action-button">Book Walk</button>
        <button type="button" class="action-button">Call Us</button>
        <button type="button" class="action-button">Email</button>
        <button type="button" class="action-button">More Info</button>
      </div>
    </div>
  </div>
  <script>
    const { createApp } = Vue;

    createApp({
      data() {
        return {
          dogImage: ''
        };
      },
      mounted() {
        fetch('https://dog.ceo/api/breeds/image/random')
          .then(response => response.json())
          .then(data => {
            this.dogImage = data.message;
          })
          .catch(error => {
            console.error('Error fetching dog image:', error);
            this.dogImage = 'https://via.placeholder.com/150';
          });
      }
    }).mount('#app');
  </script>
</body>
</html>
